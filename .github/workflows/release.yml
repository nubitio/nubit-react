name: Release

# Lockstep release flow (no changelog files — notes live in GitHub Releases):
#   1. node scripts/set-version.mjs X.Y.Z && commit
#   2. git tag vX.Y.Z && git push --tags
#   3. This workflow validates, publishes all packages to npm with provenance,
#      and creates a GitHub Release with auto-generated notes.
#
# Release candidates use the same flow with a prerelease version
# (set-version.mjs 1.0.0-rc.1, tag v1.0.0-rc.1). They publish under the `rc`
# dist-tag and are marked as prereleases on GitHub, so `npm install` keeps
# resolving the last stable release. Consumers opt in with `^1.0.0-rc.1`,
# which also matches the final 1.0.0 — no second edit when it ships.
#
# Authentication is npm trusted publishing (OIDC): GitHub issues a short-lived
# token per run that npm exchanges for publish rights, so no long-lived
# NPM_TOKEN secret is involved. Each package must have a matching trusted
# publisher configured on npmjs.com (organization `nubitio`, repository
# `nubit-react`, workflow filename `release.yml`). See docs/npm-trusted-publishing.md.
#
# This replaces token-based publishing, which npm is retiring for 2FA-bypass
# tokens (~Jan 2027) as part of its supply-chain hardening.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1. Node 24 ships a recent 11.x,
      # but pin the floor explicitly so a runner image change can't silently
      # drop below it and turn every publish into npm's masked 404.
      - name: Ensure npm CLI supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package version $PKG_VERSION."
            echo "Run: node scripts/set-version.mjs $TAG_VERSION  (and commit) before tagging."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Validate publish artifacts (publint + attw)
        run: pnpm validate:packages

      # A prerelease must not become what `npm install @nubitio/…` resolves to.
      # Anything with a hyphen in the version (1.0.0-rc.1) publishes under the
      # `rc` dist-tag; only a final version takes `latest`.
      - name: Resolve the dist-tag
        id: dist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-*) echo "tag=rc" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Auth is OIDC. There is deliberately no NODE_AUTH_TOKEN: npm only
      # attempts trusted publishing when no long-lived token is configured.
      # Provenance is generated automatically under trusted publishing; the
      # flag is kept explicit so the guarantee survives a future CLI change.
      - name: Publish to npm (lockstep, dependency order)
        run: pnpm publish -r --access public --no-git-checks --tag "${{ steps.dist.outputs.tag }}"
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Create GitHub Release with auto-generated notes
        run: |
          if [ "${{ steps.dist.outputs.prerelease }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
